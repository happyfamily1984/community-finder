# APK 클라우드 빌드: 테스트 → 화면 스크린샷 → 서명된 APK 빌드 → GitHub Releases에 게시
name: android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 테스트 + 화면 스크린샷
        run: ./gradlew testDebugUnitTest -Proborazzi.test.record=true

      - name: APK 빌드
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../community-finder.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: android/app/build/screens/

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: community-finder.apk

      - name: Releases에 게시
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 커뮤니티 파인더 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            휴대폰에서 아래 **community-finder.apk** 를 눌러 설치하세요.
            (처음 설치 시 "출처를 알 수 없는 앱 설치"를 허용해야 합니다.)
          files: community-finder.apk
